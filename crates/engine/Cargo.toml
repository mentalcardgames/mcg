[package]
name = "cgdsl-engine"
edition = "2021"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "engine-tui"
path = "src/bin/engine-tui/main.rs"

[features]
default = []
# Bridge `trace_sender` events into the `tracing` crate (see
# `interpreter::trace_tracing` / observability.md §2.4).
tracing = ["dep:tracing"]

[dependencies]
front_end = { workspace = true }
rand = { workspace = true }
thiserror = "2"
tracing = { workspace = true, optional = true }
ratatui = "0.28"
crossterm = "0.28"
crossbeam-channel = "0.5"

[[test]]
name = "setting_up_test"
path = "tests/setup_test.rs"