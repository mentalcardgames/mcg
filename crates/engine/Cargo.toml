[package]
name = "cgdsl-engine"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "engine-tui"
path = "src/bin/engine-tui/main.rs"

[dependencies]
front_end = { path = "../front_end" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
indexmap = "2"
dashmap = "5"
anyhow = "1"
ratatui = "0.28"
crossterm = "0.28"
crossbeam-channel = "0.5"
